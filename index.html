<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mandelbrot Fractal - Fullscreen White</title>
    <style>
        /* [CSS 영역] 화면 전체 여백 제거 및 스크롤바 방지 */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000; /* 완전한 검은색 배경 */
            font-family: sans-serif;
        }

        /* 캔버스를 전체 화면으로 고정 */
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            cursor: crosshair;
        }

        /* 로딩 표시 스타일 (우측 하단에 심플하게 배치) */
        #loading {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            letter-spacing: 1px;
            pointer-events: none; /* 클릭 방해 금지 */
            transition: opacity 0.2s;
        }

        /* 로딩이 끝났을 때 숨기기 위한 클래스 */
        .hidden {
            opacity: 0;
        }
    </style>
</head>
<body>

    <canvas id="mandelbrotCanvas"></canvas>
    <div id="loading">그리는 중...</div>

    <script>
        // [자바스크립트 영역] 화면 비율 맞춤 및 흑백 프랙탈 로직
        document.addEventListener("DOMContentLoaded", () => {
            const canvas = document.getElementById('mandelbrotCanvas');
            const ctx = canvas.getContext('2d');
            const loading = document.getElementById('loading');

            let WIDTH, HEIGHT;
            let state = {
                xMin: -2.0,
                xMax: 1.0,
                yMin: -1.2,
                yMax: 1.2,
                maxIterations: 150 // 기본 해상도 속도 최적화
            };
            let zoomFactor = 1;

            // 브라우저 창 크기에 맞게 캔버스 사이즈 조절 및 비율 맞춤
            function resizeCanvas() {
                WIDTH = window.innerWidth;
                HEIGHT = window.innerHeight;
                canvas.width = WIDTH;
                canvas.height = HEIGHT;

                // 화면 왜곡을 막기 위해 가로세로 비율(Aspect Ratio)에 맞춰 수학적 좌표축 조정
                const viewWidth = state.xMax - state.xMin;
                const expectedHeight = viewWidth * (HEIGHT / WIDTH);
                const cy = (state.yMin + state.yMax) / 2;
                
                state.yMin = cy - expectedHeight / 2;
                state.yMax = cy + expectedHeight / 2;
            }

            // 망델브로 계산 점화식
            function mandelbrot(cx, cy) {
                let zx = 0;
                let zy = 0;
                let i = 0;
                while (zx*zx + zy*zy < 4 && i < state.maxIterations) {
                    let xtemp = zx*zx - zy*zy + cx;
                    zy = 2*zx*zy + cy;
                    zx = xtemp;
                    i++;
                }
                return i;
            }

            // 검은 배경에 하얀색으로 그리기
            function drawMandelbrot() {
                loading.classList.remove('hidden');

                setTimeout(() => {
                    const imageData = ctx.createImageData(WIDTH, HEIGHT);
                    const data = imageData.data;

                    for (let py = 0; py < HEIGHT; py++) {
                        for (let px = 0; px < WIDTH; px++) {
                            
                            let cx = state.xMin + (px / WIDTH) * (state.xMax - state.xMin);
                            let cy = state.yMin + (py / HEIGHT) * (state.yMax - state.yMin);

                            let iterations = mandelbrot(cx, cy);
                            let pixelIndex = (py * WIDTH + px) * 4;
                            
                            if (iterations === state.maxIterations) {
                                // 망델브로 집합 내부: 완전한 검은색
                                data[pixelIndex] = 0;
                                data[pixelIndex + 1] = 0;
                                data[pixelIndex + 2] = 0;
                            } else {
                                // 집합 경계면 외부: 반복 횟수가 많을수록 새하얗게 빛남
                                let brightness = Math.pow(iterations / state.maxIterations, 0.7) * 255;
                                
                                data[pixelIndex] = brightness;     // R
                                data[pixelIndex + 1] = brightness; // G
                                data[pixelIndex + 2] = brightness; // B
                            }
                            data[pixelIndex + 3] = 255; // 불투명도 100%
                        }
                    }

                    ctx.putImageData(imageData, 0, 0);
                    loading.classList.add('hidden');
                }, 30);
            }

            // 클릭 시 해당 지점 중심으로 2.5배 확대
            canvas.addEventListener('click', (e) => {
                const rect = canvas.getBoundingClientRect();
                const px = e.clientX - rect.left;
                const py = e.clientY - rect.top;

                // 클릭한 곳의 복소수 좌표 구하기
                const clickX = state.xMin + (px / WIDTH) * (state.xMax - state.xMin);
                const clickY = state.yMin + (py / HEIGHT) * (state.yMax - state.yMin);

                // 2.5배 확대 연산
                const newWidth = (state.xMax - state.xMin) / 2.5;
                const newHeight = (state.yMax - state.yMin) / 2.5;

                state.xMin = clickX - newWidth / 2;
                state.xMax = clickX + newWidth / 2;
                state.yMin = clickY - newHeight / 2;
                state.yMax = clickY + newHeight / 2;
                
                // 깊이 들어갈수록 선명도를 높이기 위해 반복수 점진적 증가
                state.maxIterations += 35; 

                drawMandelbrot();
            });

            // 화면 크기가 바뀔 때를 대비한 리사이즈 이벤트
            window.addEventListener('resize', () => {
                resizeCanvas();
                drawMandelbrot();
            });

            // 최초 실행
            resizeCanvas();
            drawMandelbrot();
        });
    </script>
</body>
</html>
