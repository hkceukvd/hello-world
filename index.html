<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fractal Explorer</title>

<style>
html, body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:black;
}
canvas{
    display:block;
    cursor:crosshair;
}
#info{
    position:absolute;
    top:10px;
    left:10px;
    color:white;
    font-family:Arial;
    font-size:14px;
}
</style>
</head>

<body>

<div id="info">
    클릭: 확대<br>
    우클릭: 축소<br>
    휠: 확대/축소
</div>

<canvas id="canvas"></canvas>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

function resize(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    draw();
}
window.addEventListener("resize", resize);

let scale = 1;
let offsetX = 0;
let offsetY = 0;

function koch(x1,y1,x2,y2,depth){

    if(depth === 0){
        ctx.beginPath();
        ctx.moveTo(x1,y1);
        ctx.lineTo(x2,y2);
        ctx.stroke();
        return;
    }

    const dx = x2-x1;
    const dy = y2-y1;

    const ax = x1 + dx/3;
    const ay = y1 + dy/3;

    const bx = x1 + 2*dx/3;
    const by = y1 + 2*dy/3;

    const angle = Math.PI/3;

    const px = ax + (bx-ax)*Math.cos(angle) - (by-ay)*Math.sin(angle);
    const py = ay + (bx-ax)*Math.sin(angle) + (by-ay)*Math.cos(angle);

    koch(x1,y1,ax,ay,depth-1);
    koch(ax,ay,px,py,depth-1);
    koch(px,py,bx,by,depth-1);
    koch(bx,by,x2,y2,depth-1);
}

function drawSnowflake(depth){

    const size = 300;

    const h = Math.sqrt(3)*size/2;

    const p1 = {x:0, y:-h/2};
    const p2 = {x:-size/2, y:h/2};
    const p3 = {x:size/2, y:h/2};

    koch(p1.x,p1.y,p2.x,p2.y,depth);
    koch(p2.x,p2.y,p3.x,p3.y,depth);
    koch(p3.x,p3.y,p1.x,p1.y,depth);
}

function draw(){

    ctx.setTransform(1,0,0,1,0,0);
    ctx.clearRect(0,0,canvas.width,canvas.height);

    ctx.fillStyle="black";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    ctx.translate(canvas.width/2 + offsetX,
                  canvas.height/2 + offsetY);

    ctx.scale(scale,scale);

    ctx.strokeStyle="white";
    ctx.lineWidth = 1/scale;

    drawSnowflake(6);
}

canvas.addEventListener("click",(e)=>{

    const rect = canvas.getBoundingClientRect();

    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;

    offsetX -= (mx - canvas.width/2 - offsetX)*0.5;
    offsetY -= (my - canvas.height/2 - offsetY)*0.5;

    scale *= 2;

    draw();
});

canvas.addEventListener("contextmenu",(e)=>{
    e.preventDefault();

    scale /= 2;

    draw();
});

canvas.addEventListener("wheel",(e)=>{

    e.preventDefault();

    const factor = e.deltaY < 0 ? 1.2 : 0.8;

    scale *= factor;

    draw();

},{passive:false});

resize();

</script>

</body>
</html>
